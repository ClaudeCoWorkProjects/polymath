<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog – Spalten – Personal geht anders.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f3;--card:#fff;--line:#dcdcdc;--ink:#000;--soft:#3d3d3d;--mute:#6b6b6b;--blue:#1d9bf0;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}
header.top{position:sticky;top:0;z-index:50;background:rgba(243,243,243,.92);backdrop-filter:blur(10px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
nav{display:flex;gap:32px}
nav a{font-size:.875rem;color:var(--soft);text-decoration:none}
@media(max-width:640px){nav{display:none}}
.kicker{color:var(--mute);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.intro{padding:clamp(20px,4vw,48px) 0 clamp(20px,3vw,32px);display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
h1{font-size:clamp(2rem,5.5vw,3.5rem);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin-top:14px}
.total{color:var(--mute);font-size:.9rem}

/* Neu-Streifen */
.fresh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:clamp(32px,5vw,56px)}
.fc{position:relative;display:flex;align-items:flex-end;aspect-ratio:16/9;border-radius:18px;overflow:hidden;color:#fff;text-decoration:none;background:linear-gradient(135deg,#6b6b6b,#3a3a3a);
  transition:transform .45s cubic-bezier(.22,.8,.2,1),box-shadow .45s}
.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.22,.8,.2,1)}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.05) 70%)}
.fc:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.18)}
.fc:hover img{transform:scale(1.05)}
.fc div{position:relative;z-index:1;padding:16px 18px}
.fc small{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:4px}
.fc b{font-size:1.0625rem;line-height:1.2;letter-spacing:-.015em;font-weight:700}
.fc.n1{background:linear-gradient(135deg,#8a8a8a,#555)}.fc.n2{background:linear-gradient(135deg,#4a4a4a,#222)}
@media(max-width:860px){.fresh{grid-template-columns:1fr}.fc{aspect-ratio:16/8}}

/* Spalten */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);padding-bottom:clamp(48px,8vw,96px);align-items:start}
.col{background:var(--card);border-radius:22px;padding:clamp(20px,2.4vw,32px);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.col>summary{list-style:none;cursor:default}
.col>summary::-webkit-details-marker{display:none}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:18px;margin-bottom:6px;border-bottom:2px solid var(--ink)}
.ch h2{font-size:1.25rem;letter-spacing:-.02em;font-weight:700;line-height:1.15}
.ch .cnt{font-size:2.5rem;line-height:1;letter-spacing:-.04em;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.col ul{list-style:none}
.col li a{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid #eee;text-decoration:none;color:var(--ink);align-items:baseline;
  transition:transform .35s cubic-bezier(.22,.8,.2,1),color .25s}
.col li:last-child a{border-bottom:0}
.col .d{font-size:.7rem;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.col .t{font-size:.9375rem;line-height:1.3;font-weight:500;letter-spacing:-.005em}
.col ul:hover a{color:#9c9c9c}
.col ul:hover a:hover{color:var(--ink);transform:translateX(6px)}
.col ul:hover a:hover .t{font-weight:700}
.col li a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.more{margin-top:10px;font-size:.85rem}
@media(max-width:860px){
  .cols{grid-template-columns:1fr;gap:12px}
  .col{padding:0 20px;border-radius:16px}
  .col>summary{cursor:pointer;padding:18px 0}
  .ch{border:0;margin:0;padding:0;align-items:center}
  .col[open]>summary .ch{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
  .col ul{padding-bottom:12px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="../../index.html">Personal geht anders.</a><nav><a href="#">Über mich</a><a href="#">Meine Garantie</a><a href="#">FAQ</a><a href="#">Kontakt</a></nav></div></header>

<section class="wrap intro">
  <div><div class="kicker">Blog · Variante 4: Spalten (42 Einträge als Test)</div><h1>Alle Beiträge auf einen Blick.</h1></div>
  <div class="total" id="total"></div>
</section>

<main class="wrap">
  <div class="kicker" style="margin-bottom:14px">Neu</div>
  <div class="fresh" id="fresh"></div>
  <div class="cols" id="cols"></div>
</main>

<script>
const T=[
 {k:'mitarbeitermotivation',n:'Mitarbeitermotivation',img:'../hero.webp'},
 {k:'betriebsklima',n:'Betriebsklima',img:'../hero-klima.jpg'},
 {k:'performance',n:'Performance',img:'../hero-performance.jpg'}
];
const real=[
 {t:0,d:'25.10.',title:'Menschen motivieren: Unmöglich, und doch ganz leicht.',href:'mitarbeitermotivation.html'},
 {t:1,d:'25.10.',title:'Erst wohlfühlen. Dann mehr Leisten.',href:'betriebsklimaoptimierung.html'},
 {t:2,d:'25.10.',title:'Es geht immer mehr, wenn man weiß wie.',href:'performancesteigerung.html'}
];
const fill=['Platzhalter-Titel in kurzer Form','Platzhalter-Titel in mittlerer Länge für den Test','Ein Platzhalter-Titel, der in echt auch zwei Zeilen brauchen kann','Kurz und knapp','Warum das so ist und was man dagegen tun kann'];
const posts=[...real];
for(let i=0;i<39;i++){posts.push({t:i%3,d:String(24-Math.floor(i/3)).padStart(2,'0')+'.'+(i<30?'10.':'09.'),title:fill[i%fill.length],href:'#',ph:true});}
const cols=document.getElementById('cols');
T.forEach((c,ci)=>{
  const list=posts.filter(p=>p.t===ci);
  const d=document.createElement('details');d.className='col';d.open=true;
  d.innerHTML='<summary><div class="ch"><h2>'+c.n+'</h2><span class="cnt">'+list.length+'</span></div></summary><ul>'+
    list.map(p=>'<li><a href="'+p.href+'"><span class="d">'+p.d+'</span><span class="t">'+p.title+'</span></a></li>').join('')+'</ul>';
  cols.appendChild(d);
});
const fresh=document.getElementById('fresh');
real.forEach((p,i)=>{
  const t=T[p.t];
  fresh.insertAdjacentHTML('beforeend','<a class="fc" href="'+p.href+'"><img src="'+t.img+'" alt=""><div><small>'+t.n+' · '+p.d+'</small><b>'+p.title+'</b></div></a>');
});
document.getElementById('total').textContent=posts.length+' Beiträge in 3 Themen';
// Handy: Spalten einklappbar (erste offen), Desktop: immer offen
const mq=matchMedia('(max-width:860px)');
function sync(){document.querySelectorAll('.col').forEach((d,i)=>{d.open=!mq.matches||i===0});}
mq.addEventListener('change',sync);sync();
cols.addEventListener('click',e=>{if(!mq.matches&&e.target.closest('summary'))e.preventDefault()});
</script>
</body>
</html>
