<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog – Personal geht anders.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f3;--card:#fff;--line:#e0e0e0;--ink:#000;--soft:#3d3d3d;--mute:#6b6b6b;--blue:#1d9bf0;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}
header.top{position:sticky;top:0;z-index:50;background:rgba(243,243,243,.92);backdrop-filter:blur(10px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
nav{display:flex;gap:32px}
nav a{font-size:.875rem;color:var(--soft);text-decoration:none}
@media(max-width:640px){nav{display:none}}
a{color:inherit}
.thumb{background:linear-gradient(135deg,#6b6b6b,#3a3a3a) center/cover;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.22,.8,.2,1)}
.g1{background:linear-gradient(135deg,#8a8a8a,#555)}.g2{background:linear-gradient(135deg,#4a4a4a,#222)}.g3{background:linear-gradient(135deg,#a3a3a3,#6b6b6b)}

/* Aufmacher */
.feature{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;margin:clamp(12px,2vw,24px) 0 clamp(40px,6vw,72px);text-decoration:none}
.feature .thumb{aspect-ratio:16/10;border-radius:22px}
.feature:hover .thumb img{transform:scale(1.04)}
.kicker{color:var(--mute);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.feature h2{font-size:clamp(1.75rem,3.6vw,2.75rem);line-height:1.08;letter-spacing:-.035em;font-weight:700}
.feature p{margin-top:16px;color:var(--soft);font-size:1.0625rem;max-width:42ch}
.feature .more{display:inline-block;margin-top:18px;font-size:.9rem;transition:transform .3s}
.feature:hover .more{transform:translateX(6px)}
@media(max-width:800px){.feature{grid-template-columns:1fr}}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{font:inherit;font-size:.75rem;line-height:1;padding:7px 12px;border-radius:999px;background:#e9e9e9;color:var(--soft);border:0;cursor:pointer;transition:background .2s,color .2s}
.pill:hover{background:#dcdcdc;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff}

/* Kopf + Filter */
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.head h1{font-size:clamp(1.75rem,3.6vw,2.5rem);line-height:1.1;letter-spacing:-.035em;font-weight:700}
.head p{margin-top:8px;color:var(--soft);font-size:1rem;max-width:36ch}
.search{position:relative}
.search input{font:inherit;font-size:.9rem;width:min(280px,100%);padding:12px 16px 12px 40px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:0;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,155,240,.18)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 clamp(24px,4vw,40px)}
.chip{font:inherit;font-size:.85rem;display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border-radius:999px;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s}
.chip:hover{border-color:var(--ink)}
.chip b{font-weight:500;color:var(--mute);font-size:.75rem;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on b{color:#bbb}
.chip:focus-visible,.pill:focus-visible,.card:focus-visible,.feature:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* Raster */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,3vw,40px) clamp(20px,2.4vw,32px)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.item{display:flex;flex-direction:column;animation:in .5s cubic-bezier(.22,.8,.2,1) both;animation-delay:calc(var(--n,0)*35ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.item[hidden]{display:none}
.card{display:block;text-decoration:none}
.card .thumb{aspect-ratio:16/10;border-radius:18px;transition:transform .45s cubic-bezier(.22,.8,.2,1),box-shadow .45s}
.card:hover .thumb{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.14)}
.card:hover .thumb img{transform:scale(1.05)}
.card h3{margin-top:16px;font-size:1.125rem;line-height:1.25;letter-spacing:-.02em;font-weight:700}
.card p{margin-top:8px;font-size:.9rem;color:var(--soft);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pills{margin-top:12px}
.none{display:none;padding:48px 0;color:var(--mute)}
.loadmore{display:flex;justify-content:center;margin:clamp(32px,5vw,56px) 0 clamp(56px,8vw,104px)}
.loadmore button{font:inherit;font-size:.9rem;padding:13px 28px;border-radius:999px;border:1px solid var(--ink);background:transparent;cursor:pointer;transition:background .25s,color .25s}
.loadmore button:hover{background:var(--ink);color:#fff}
.loadmore[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.item{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="#">Personal geht anders.</a><nav><a href="../ueber-mich/variante-karten.html">Über mich</a><a href="#">Meine Garantie</a><a href="#">FAQ</a><a href="index.html">Blog</a><a href="#">Kontakt</a></nav></div></header>

<main class="wrap">
  <a class="feature" id="feature" href="#"></a>

  <div class="head">
    <div><h1>Alle Beiträge</h1><p>Kurz gelesen, lange gewirkt. Nach Thema filtern oder suchen.</p></div>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Beiträge durchsuchen" aria-label="Beiträge durchsuchen"></label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Themen"></div>

  <div class="grid" id="grid"></div>
  <p class="none" id="none">Keine Beiträge gefunden.</p>
  <div class="loadmore" id="more" hidden><button type="button" id="moreBtn"></button></div>
</main>

<script src="beitraege.js"></script>
<script>
const posts=window.BEITRAEGE.map(p=>({...p}));
const feat=posts[0];
const $=s=>document.querySelector(s);
const PAGE=12;let tag='Alle',q='',shown=PAGE;

/* Aufmacher = neuester Beitrag */
const f=feat;
$('#feature').href=f.href;
$('#feature').innerHTML='<div class="thumb"><img src="'+f.img+'" alt=""></div><div><div class="kicker">Neu · '+f.min+' Min. Lesezeit</div><h2>'+f.title+'</h2><p>'+f.teaser+'</p><div class="pills">'+f.tags.map(t=>'<span class="pill" style="cursor:default">'+t+'</span>').join('')+'</div><span class="more">Lesen →</span></div>';

/* Karten */
const grid=$('#grid');
posts.forEach(p=>{
  const li=document.createElement('article');li.className='item';
  li.innerHTML='<a class="card" href="'+p.href+'"><div class="thumb">'+(p.img?'<img src="'+p.img+'" alt="" loading="lazy">':'')+'</div><h3>'+p.title+'</h3><p>'+p.teaser+'</p></a><div class="pills">'+p.tags.map(t=>'<button type="button" class="pill" data-tag="'+t+'">'+t+'</button>').join('')+'</div>';
  p.el=li;grid.appendChild(li);
});

/* Filter-Chips aus den Themen, mit Anzahl */
const counts={};posts.forEach(p=>p.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
const names=['Alle',...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];
$('#chips').innerHTML=names.map(n=>'<button type="button" class="chip" data-tag="'+n+'" aria-pressed="false">'+n+' <b>'+(n==='Alle'?posts.length:counts[n])+'</b></button>').join('');

function render(){
  const ql=q.trim().toLowerCase();
  const match=posts.filter(p=>(tag==='Alle'||p.tags.includes(tag))&&(!ql||(p.title+' '+p.teaser+' '+p.tags.join(' ')).toLowerCase().includes(ql)));
  posts.forEach(p=>p.el.hidden=true);
  match.slice(0,shown).forEach((p,i)=>{p.el.hidden=false;p.el.style.setProperty('--n',Math.min(i,12));p.el.style.animation='none';p.el.offsetHeight;p.el.style.animation='';});
  document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.tag===tag;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});
  document.querySelectorAll('.item .pill').forEach(b=>b.classList.toggle('on',b.dataset.tag===tag));
  $('#none').style.display=match.length?'none':'block';
  const rest=match.length-shown;$('#more').hidden=rest<=0;$('#moreBtn').textContent='Weitere '+Math.min(rest,PAGE)+' anzeigen ('+rest+' übrig)';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tag]');if(!t)return;
  tag=(tag===t.dataset.tag&&t.classList.contains('pill'))?'Alle':t.dataset.tag;shown=PAGE;render();
});
$('#q').addEventListener('input',e=>{q=e.target.value;shown=PAGE;render()});
$('#moreBtn').addEventListener('click',()=>{shown+=PAGE;render()});
render();
</script>
</body>
</html>
